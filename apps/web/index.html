<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bots Flows Builder</title>
    <script>
      /* Tema aplicado antes del primer pintado para evitar el parpadeo blanco.
         Espejo mínimo de src/shared/theme: si cambia la clave o el atributo,
         actualizar también shared/theme/storage/themeStore.ts y
         shared/theme/dom/applyThemeToDocument.ts. */
      (function () {
        try {
          var stored = window.localStorage.getItem("bots-ai-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
