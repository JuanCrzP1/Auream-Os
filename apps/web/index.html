<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Isotipo oficial. Fuente única: src/shared/brand/. Vite lo procesa y le
         pone hash en el build; no hay copia en ninguna otra carpeta. -->
    <link rel="icon" type="image/png" href="./src/shared/brand/auream-mark-web.png" />
    <!-- Copia obligada de BRAND_NAME (src/shared/brand/brand.ts): este
         documento se sirve antes de que arranque React y no puede importarlo.
         Si cambia la marca, actualizar ambos. -->
    <title>AUREAM OS</title>
    <script>
      /* Tema aplicado antes del primer pintado para evitar el parpadeo.
         Espejo mínimo de src/shared/theme: si cambia la clave, el atributo o
         el tema por defecto, actualizar también
         shared/theme/storage/themeStore.ts, shared/theme/contracts/Theme.ts y
         shared/theme/dom/applyThemeToDocument.ts. */
      (function () {
        var theme = "dark";
        try {
          var stored = window.localStorage.getItem("bots-ai-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          }
        } catch (error) {
          /* Sin almacenamiento se mantiene el tema por defecto. */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
